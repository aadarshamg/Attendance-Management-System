name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # postinstall runs `prisma generate`, which only needs these to be present
    # (not reachable) to validate the schema — no live DB is used in CI.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck + build (shared, api, web)
        run: npm run build

      - name: Unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t ams-api .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t ams-web .
