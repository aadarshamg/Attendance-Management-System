# Full local stack: db + object storage + API + web.
#   docker compose -f docker-compose.full.yml up --build
# Then open http://localhost:8080  (admin ADMIN001 / password123 once seeded).
# First run: set RUN_SEED=true on the api service (below) or run it once manually.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
      POSTGRES_DB: ams
    volumes:
      - ams_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - ams_minio:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/ams-attendance-images;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ams:ams@db:5432/ams
      JWT_SECRET: local-dev-secret-change-me
      JWT_TTL: 12h
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: ams-attendance-images
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      NOMINATIM_USER_AGENT: "AttendanceMgmtSystem/1.0 (contact: you@example.com)"
      CORS_ORIGIN: http://localhost:8080
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ams_db:
  ams_minio:
